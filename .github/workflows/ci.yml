name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fcs
          POSTGRES_PASSWORD: fcs
          POSTGRES_DB: fcs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fcs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fcs:fcs@localhost:5432/fcs_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r test

  chaos-1000:
    # Larger chaos run on pushes to main: 1,000 seeded services (about 2 minutes).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fcs/sync-core exec vitest run test/chaos.test.ts
        env:
          CHAOS_SEEDS: "1000"
