name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fcs
          POSTGRES_PASSWORD: fcs
          POSTGRES_DB: fcs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fcs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fcs:fcs@localhost:5432/fcs_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r test

  chaos-1000:
    # Larger chaos run: 1,000 seeded services (about 2 minutes).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fcs/sync-core exec vitest run test/chaos.test.ts
        env:
          CHAOS_SEEDS: "1000"

  e2e:
    # Real API + dashboard + browser: the sprint S1 demo (menu built on the web reaches a device).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fcs
          POSTGRES_PASSWORD: fcs
          POSTGRES_DB: fcs_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fcs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://fcs:fcs@localhost:5432/fcs_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @fcs/dashboard exec playwright install --with-deps chromium
      - run: pnpm --filter @fcs/dashboard e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report

  dart-pricing:
    # The POS app's totals engine (Dart) must match the TypeScript one on every shared fixture.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pricing_dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.5"
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed --line-length 120 .
      - run: dart analyze --fatal-infos
      - run: dart test
